<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sidharth | Portfolio</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --lime: #b6ff00;
      --glass-bg: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.16);
    }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      color: #fff;
      background: #000;
      padding-bottom: 90px;
      overflow-x: hidden;
    }

    .glow {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 70% 55% at 30% 100%, rgba(182, 255, 0, 0.72), transparent 72%),
        radial-gradient(ellipse 65% 50% at 70% 100%, rgba(255, 255, 255, 0.5), transparent 72%),
        #000;
    }

    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.55);
    }

    .topbar {
      max-width: 920px;
      margin: 20px auto 0;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      color: rgba(255, 255, 255, 0.85);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--lime);
      box-shadow: 0 0 10px var(--lime);
      animation: pulse 2s infinite;
    }
    .cmd-trigger {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      color: #fff;
      font: inherit;
      font-size: 0.82rem;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: border-color .2s;
    }
    .cmd-trigger:hover { border-color: var(--lime); }
    .kbd {
      background: rgba(255, 255, 255, 0.12);
      padding: 1px 6px;
      border-radius: 6px;
      font-size: 0.75rem;
      color: var(--lime);
    }

    .hero {
      max-width: 720px;
      margin: 8vh auto 0;
      padding: 52px 32px;
      text-align: center;
      animation: rise .6s ease-out;
    }
    .hero h1 { font-size: 2.8rem; margin-bottom: 12px; letter-spacing: -0.02em; }
    .hero p { opacity: .85; line-height: 1.65; max-width: 52ch; margin-inline: auto; }
    .hero p + p { margin-top: 8px; opacity: .75; font-size: 0.96rem; }

    .tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
    }
    .tag {
      font-size: 0.8rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(182, 255, 0, 0.12);
      border: 1px solid rgba(182, 255, 0, 0.35);
      color: var(--lime);
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 26px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      border-radius: 999px;
      font: inherit;
      font-weight: 600;
      font-size: 0.92rem;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: transform .15s, background .2s, border-color .2s;
    }
    .btn.primary { background: var(--lime); color: #000; }
    .btn.primary:hover { transform: translateY(-2px); background: #c8ff3d; }
    .btn.secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid var(--glass-border);
    }
    .btn.secondary:hover { transform: translateY(-2px); border-color: var(--lime); }

    .section {
      max-width: 920px;
      margin: 56px auto 0;
      padding: 0 20px;
      animation: rise .75s ease-out;
    }
    .section h2 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section h2::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--lime);
      box-shadow: 0 0 12px var(--lime);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      perspective: 900px;
    }
    .card {
      position: relative;
      overflow: hidden;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 18px;
      transform-style: preserve-3d;
      transition: transform .15s ease-out, border-color .2s;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(240px circle at var(--mx, 50%) var(--my, 50%), rgba(182, 255, 0, 0.18), transparent 70%);
      opacity: 0;
      transition: opacity .25s;
      pointer-events: none;
    }
    .card:hover::before { opacity: 1; }
    .card:hover { border-color: var(--lime); }
    .card-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--lime);
      margin-bottom: 6px;
    }
    .card h3 { font-size: 1.2rem; margin-bottom: 6px; }
    .card p { font-size: 0.88rem; color: rgba(255, 255, 255, 0.72); line-height: 1.5; }
    .card-links { display: flex; gap: 16px; position: relative; z-index: 2; }
    .card a { color: var(--lime); text-decoration: none; font-weight: 600; font-size: 0.92rem; }
    .card a:hover { text-decoration: underline; }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }
    .overlay.open { display: flex; animation: fadeIn .18s ease-out; }
    .modal-box {
      width: 100%;
      max-width: 520px;
      padding: 28px;
      background: #0d0d0d;
      border: 1px solid rgba(182, 255, 0, 0.4);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85);
    }
    .modal-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .close-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
    }
    .close-btn:hover { border-color: var(--lime); color: var(--lime); }
    .cmd-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      font: inherit;
      font-size: 0.95rem;
      outline: none;
      margin-bottom: 12px;
    }
    .cmd-input:focus { border-color: var(--lime); }
    .cmd-list { display: flex; flex-direction: column; gap: 6px; }
    .cmd-item {
      padding: 10px 14px;
      border-radius: 12px;
      background: transparent;
      border: 1px solid transparent;
      color: #fff;
      font: inherit;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cmd-item:hover, .cmd-item.active {
      background: rgba(182, 255, 0, 0.12);
      border-color: rgba(182, 255, 0, 0.35);
    }
    .cmd-item span { opacity: 0.6; font-size: 0.8rem; }
    .cmd-empty { padding: 14px; text-align: center; opacity: 0.6; font-size: 0.9rem; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .hero { margin: 5vh 16px 0; padding: 38px 20px; }
      .hero h1 { font-size: 2.1rem; }
    }
  </style>
</head>
<body>
  <div class="glow"></div>

  <nav class="topbar">
    <div class="status-pill">
      <span class="dot"></span>
      <span>Kerala, IN · <b id="clock">--:--</b> IST</span>
    </div>
    <button class="cmd-trigger" id="openCmd" title="Open Command Palette">
      <span>Quick Menu</span>
      <span class="kbd">Ctrl K</span>
    </button>
  </nav>

  <header class="hero glass" id="about">
    <h1>Hey, I'm Sidharth</h1>
    <p>15, building things on the web and tinkering with hardware in Kerala.</p>
    <p>Usually soldering servos, flashing microcontrollers, or shipping clean frontends.</p>

    <div class="tags">
      <span class="tag">Web Dev</span>
      <span class="tag">Robotics</span>
      <span class="tag">Embedded / IoT</span>
      <span class="tag">JavaScript</span>
    </div>

    <div class="socials">
      <a class="btn primary" href="https://github.com/Ghost8911" target="_blank" rel="noopener">GitHub</a>
      <button class="btn secondary" id="copyEmail">Copy Email</button>
    </div>
  </header>

  <section class="section" id="projects">
    <h2>Stuff I've Built</h2>
    <div class="grid" id="grid"></div>
  </section>

  <div class="overlay" id="cmdOverlay">
    <div class="modal-box">
      <div class="modal-top">
        <span class="card-badge">Jump Around</span>
        <button class="close-btn" id="closeCmd" aria-label="Close menu">✕</button>
      </div>
      <input class="cmd-input" id="cmdInput" placeholder="Search projects, GitHub, or email..." autocomplete="off">
      <div class="cmd-list" id="cmdList"></div>
    </div>
  </div>

  <script>
    const projects = [
      {
        title: 'Robotic Hand',
        tag: 'Hardware',
        desc: 'Multi-fingered mechanical hand built around servo actuation and custom linkage.',
        repo: 'https://github.com/Ghost8911/Robotic-Hand'
      },
      {
        title: 'Bionic Arm',
        tag: 'Hardware',
        desc: 'Articulated arm prototype exploring motion control and structural wearables.',
        repo: 'https://github.com/Ghost8911/Bionic-arm'
      },
      {
        title: 'UI Trap',
        tag: 'Web',
        desc: 'An intentionally mischievous web experiment that messes with normal clicks.',
        repo: 'https://github.com/Ghost8911/useless-website',
        live: 'https://ghost8911.github.io/useless-website/'
      },
      {
        title: 'Climate Action',
        tag: 'Web',
        desc: 'Interactive web project focused on sustainability and environmental awareness.',
        repo: 'https://github.com/Ghost8911/climate-action'
      }
    ];

    const grid = document.getElementById('grid');
    projects.forEach(p => {
      const card = document.createElement('article');
      card.className = 'card glass';
      card.innerHTML = `
        <div>
          <span class="card-badge">${p.tag}</span>
          <h3>${p.title}</h3>
          <p>${p.desc}</p>
        </div>
        <div class="card-links">
          <a href="${p.repo}" target="_blank" rel="noopener">Repo →</a>
          ${p.live ? `<a href="${p.live}" target="_blank" rel="noopener">Try it →</a>` : ''}
        </div>
      `;

      card.addEventListener('pointermove', e => {
        if (e.pointerType !== 'mouse') return;
        const r = card.getBoundingClientRect();
        const x = e.clientX - r.left;
        const y = e.clientY - r.top;
        card.style.setProperty('--mx', x + 'px');
        card.style.setProperty('--my', y + 'px');
        const rx = ((y / r.height) - 0.5) * -8;
        const ry = ((x / r.width) - 0.5) * 8;
        card.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg) translateY(-4px)`;
      });
      card.addEventListener('pointerleave', () => { card.style.transform = ''; });

      grid.appendChild(card);
    });

    function updateClock() {
      document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-IN', {
        timeZone: 'Asia/Kolkata',
        hour: '2-digit',
        minute: '2-digit',
        hour12: true
      });
    }
    updateClock();
    setInterval(updateClock, 15000);

    const copyBtn = document.getElementById('copyEmail');
    const EMAIL = 'sidhuvinod777@gmail.com';
    let copyTimer;
    copyBtn.onclick = async () => {
      try {
        await navigator.clipboard.writeText(EMAIL);
        copyBtn.textContent = 'Copied!';
      } catch {
        copyBtn.textContent = EMAIL;
      }
      clearTimeout(copyTimer);
      copyTimer = setTimeout(() => { copyBtn.textContent = 'Copy Email'; }, 1800);
    };

    const cmdOverlay = document.getElementById('cmdOverlay');
    const cmdInput = document.getElementById('cmdInput');
    const cmdList = document.getElementById('cmdList');
    const commands = [
      { label: 'Go to Projects', hint: '#projects', run: () => document.getElementById('projects')?.scrollIntoView({ behavior: 'smooth' }) },
      { label: 'Open GitHub', hint: 'github.com/Ghost8911', run: () => window.open('https://github.com/Ghost8911', '_blank', 'noopener') },
      { label: 'Launch UI Trap', hint: 'Live site', run: () => window.open('https://ghost8911.github.io/useless-website/', '_blank', 'noopener') },
      { label: 'Copy Email', hint: EMAIL, run: () => copyBtn.click() }
    ];

    let activeIdx = 0;
    let visibleCmds = commands;

    function renderCommands(q = '') {
      const term = q.trim().toLowerCase();
      visibleCmds = commands.filter(c =>
        c.label.toLowerCase().includes(term) || c.hint.toLowerCase().includes(term)
      );
      activeIdx = 0;
      cmdList.innerHTML = '';

      if (!visibleCmds.length) {
        cmdList.innerHTML = '<div class="cmd-empty">Nothing matches that.</div>';
        return;
      }

      visibleCmds.forEach((c, i) => {
        const btn = document.createElement('button');
        btn.className = 'cmd-item' + (i === activeIdx ? ' active' : '');
        btn.innerHTML = `<b>${c.label}</b><span>${c.hint}</span>`;
        btn.onmouseenter = () => setActive(i);
        btn.onclick = () => { closePalette(); c.run(); };
        cmdList.appendChild(btn);
      });
    }

    function setActive(i) {
      activeIdx = (i + visibleCmds.length) % visibleCmds.length;
      [...cmdList.children].forEach((el, idx) => el.classList.toggle('active', idx === activeIdx));
    }

    function openPalette() {
      cmdInput.value = '';
      renderCommands();
      cmdOverlay.classList.add('open');
      requestAnimationFrame(() => cmdInput.focus());
    }

    function closePalette() {
      cmdOverlay.classList.remove('open');
    }

    document.getElementById('openCmd').onclick = openPalette;
    document.getElementById('closeCmd').onclick = closePalette;
    cmdOverlay.onclick = e => { if (e.target === cmdOverlay) closePalette(); };
    cmdInput.oninput = () => renderCommands(cmdInput.value);

    cmdInput.addEventListener('keydown', e => {
      if (!visibleCmds.length) return;
      if (e.key === 'ArrowDown') { e.preventDefault(); setActive(activeIdx + 1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(activeIdx - 1); }
      else if (e.key === 'Enter') {
        e.preventDefault();
        const chosen = visibleCmds[activeIdx];
        closePalette();
        chosen?.run();
      }
    });

    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        cmdOverlay.classList.contains('open') ? closePalette() : openPalette();
      } else if (e.key === 'Escape' && cmdOverlay.classList.contains('open')) {
        closePalette();
      }
    });
  </script>
</body>
</html>
