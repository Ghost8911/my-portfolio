<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sidharth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1115;
      --surface: #161920;
      --border: #252a36;
      --text: #eef0f4;
      --muted: #8f96a8;
      --lime: #b8f227;
      --purple: #9d4edd;
      --sans: "DM Sans", system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.55;
      padding: 24px 28px 80px;
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--lime);
    }

    .cmd-btn {
      background: var(--surface);
      color: #e2c6ff;
      border: 1px solid #38254d;
      padding: 6px 12px;
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 12px;
      cursor: pointer;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }

    .cmd-btn:hover {
      border-color: var(--purple);
      transform: translateY(-1px);
    }

    .hero {
      display: grid;
      grid-template-columns: 1.5fr 0.9fr;
      gap: 36px;
      padding: 36px 0 40px;
      border-bottom: 1px solid var(--border);
      align-items: start;
    }

    .me-row {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 20px;
    }

    .avatar {
      width: 128px;
      height: 128px;
      border-radius: 16px;
      object-fit: cover;
      border: 2px solid var(--purple);
      flex-shrink: 0;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .avatar:hover {
      transform: scale(1.03) rotate(-1.5deg);
      border-color: var(--lime);
    }

    .avatar-fallback {
      width: 128px;
      height: 128px;
      border-radius: 16px;
      border: 2px solid var(--purple);
      background: var(--surface);
      color: var(--lime);
      font-family: var(--mono);
      font-weight: 600;
      font-size: 32px;
      display: none;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    h1 {
      font-size: 46px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.04;
      color: #ffffff;
    }

    h1 span {
      color: var(--purple);
    }

    .handle {
      font-family: var(--mono);
      font-size: 13px;
      color: #c792ea;
      margin-top: 6px;
    }

    .bio p {
      color: #cfd5e3;
      font-size: 16px;
      margin-bottom: 10px;
      max-width: 56ch;
    }

    .cta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 22px;
    }

    .btn-lime {
      background: var(--lime);
      color: #0f1115;
      text-decoration: none;
      font-family: var(--mono);
      font-size: 12.5px;
      font-weight: 600;
      padding: 9px 16px;
      border-radius: 6px;
      border: 1px solid var(--lime);
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .btn-lime:hover {
      background: #cbfc4b;
      transform: translateY(-1px);
    }

    .btn-ghost {
      background: var(--surface);
      color: var(--text);
      font-family: var(--mono);
      font-size: 12.5px;
      padding: 9px 16px;
      border-radius: 6px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease, transform 0.15s ease;
    }

    .btn-ghost:hover {
      border-color: var(--purple);
      color: #e2c6ff;
      transform: translateY(-1px);
    }

    .email-note {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
    }

    .side-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--purple);
      border-radius: 10px;
      padding: 18px 20px;
      font-family: var(--mono);
      font-size: 12.5px;
    }

    .side-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #c792ea;
      margin-bottom: 6px;
    }

    .stack-list {
      color: var(--lime);
      margin-bottom: 18px;
      line-height: 1.65;
    }

    .repo-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .repo-list a {
      color: var(--text);
      text-decoration: none;
      padding: 4px 0;
      border-bottom: 1px solid transparent;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .repo-list a:hover {
      color: #e2c6ff;
      border-bottom-color: var(--purple);
    }
